name: Build and Deploy ctfgo.net

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # GitHubのアカウント名/リポジトリ名を小文字で取得
  API_IMAGE: ghcr.io/${{ github.repository }}-api:latest
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web:latest
  NGINX_IMAGE: ghcr.io/${{ github.repository }}-nginx:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Docker Buildxのセットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCRへのログイン
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Compose によるビルドとプッシュ
        run: |
          # overrideを排除し、prod用の設定を重ね合わせて3つのイメージをビルド＆プッシュ
          docker compose -f compose.yml -f compose.prod.yml build
          docker compose -f compose.yml -f compose.prod.yml push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # 1. cloudflared バイナリのインストール（数秒で終わります）
      - name: Install cloudflared
        run: |
          curl -L --output /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

      # 2. VPSへ Cloudflare Tunnel 経由で SSH 接続してデプロイ
      - name: VPSへSSH接続してデプロイ
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }} # 例: ssh.ctfgo.net
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          # cloudflared を使い、Service Token を渡してプロキシ接続する
          proxy_command: >-
            cloudflared access ssh
            --hostname %h
            --id ${{ secrets.CF_ACCESS_CLIENT_ID }}
            --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          envs: ENV_FILE,API_IMAGE,WEB_IMAGE,NGINX_IMAGE
          script: |
            mkdir -p ~/server/ctfgonet
            cd ~/server/ctfgonet
            
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            echo "$ENV_FILE" > .env
            echo "API_IMAGE=$API_IMAGE" >> .env
            echo "WEB_IMAGE=$WEB_IMAGE" >> .env
            echo "NGINX_IMAGE=$NGINX_IMAGE" >> .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f compose.yml -f compose.prod.yml pull
            docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
            docker image prune -f
