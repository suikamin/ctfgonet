name: Build and Deploy ctfgo.net

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # GitHubのアカウント名/リポジトリ名を小文字で取得
  API_IMAGE: ghcr.io/${{ github.repository }}-api:latest
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web:latest
  NGINX_IMAGE: ghcr.io/${{ github.repository }}-nginx:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Docker Buildxのセットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCRへのログイン
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Compose によるビルドとプッシュ
        run: |
          # overrideを排除し、prod用の設定を重ね合わせて3つのイメージをビルド＆プッシュ
          docker compose -f compose.yml -f compose.prod.yml build
          docker compose -f compose.yml -f compose.prod.yml push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # 1. cloudflared のインストール
      - name: Install cloudflared
        run: |
          curl -L --output /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

      # 2. SSH 接続とデプロイを実行
      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          IMAGE_API: ${{ env.IMAGE_API }}
          IMAGE_WEB: ${{ env.IMAGE_WEB }}
          IMAGE_NGINX: ${{ env.IMAGE_NGINX }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$CF_CLIENT_ID" ] || [ -z "$CF_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID または CF_ACCESS_CLIENT_SECRET が設定されていません。"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat << EOF > ~/.ssh/config
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h --id "$CF_CLIENT_ID" --secret "$CF_CLIENT_SECRET"
            StrictHostKeyChecking no
          EOF

          ENV_BASE64=$(echo "$ENV_FILE" | base64 -w 0)

          ssh vps << EOF
            mkdir -p ~/server/ctfgonet
            cd ~/server/ctfgonet

            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/$REPO_NAME.git .
            fi

            echo "$ENV_BASE64" | base64 -d > .env
            echo "API_IMAGE=$IMAGE_API" >> .env
            echo "WEB_IMAGE=$IMAGE_WEB" >> .env
            echo "NGINX_IMAGE=$IMAGE_NGINX" >> .env

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u $ACTOR --password-stdin
            docker compose -f compose.yml -f compose.prod.yml pull
            docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
            docker image prune -f
          EOF
